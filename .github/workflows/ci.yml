name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore and build solution
        shell: pwsh
        run: |
          dotnet restore ThunderbirdMboxRecovery.sln
          dotnet build ThunderbirdMboxRecovery.sln `
            -c Release `
            --no-restore `
            -warnaserror

      - name: Validate portable x86 and x64 publication
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "src/ThunderbirdMboxRecovery/ThunderbirdMboxRecovery.csproj"

          foreach ($rid in @("win-x86", "win-x64")) {
            $output = Join-Path $env:RUNNER_TEMP $rid

            dotnet restore $project -r $rid
            if ($LASTEXITCODE -ne 0) {
              throw "Falha no restore para $rid."
            }

            dotnet publish $project `
              -c Release `
              -r $rid `
              --self-contained true `
              --no-restore `
              -p:PublishSingleFile=true `
              -p:PublishTrimmed=false `
              -o $output
            if ($LASTEXITCODE -ne 0) {
              throw "Falha no publish para $rid."
            }

            $exe = Join-Path $output "ThunderbirdMboxRecovery.exe"
            if (-not (Test-Path $exe -PathType Leaf)) {
              throw "Executável $rid não foi gerado."
            }

            $size = (Get-Item $exe).Length
            if ($size -lt 1MB) {
              throw "Executável $rid possui tamanho inválido: $size bytes."
            }

            Write-Host "$rid validado: $size bytes."
          }
