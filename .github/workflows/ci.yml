name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Confirm .NET 8 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkVersion = (dotnet --version).Trim()
          Write-Host "SDK .NET selecionado: $sdkVersion"
          if (-not $sdkVersion.StartsWith("8.")) {
            throw "SDK .NET incorreto. Esperado 8.x, obtido $sdkVersion."
          }

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellSyntax.ps1 -Paths @(
            "./scripts/Publish-Portable.ps1",
            "./scripts/Test-PowerShellSyntax.ps1"
          )

      - name: Restore and build solution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore ThunderbirdMboxRecovery.sln `
            -p:SelfContained=false `
            -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) {
            throw "Falha no restore da solução."
          }

          dotnet build ThunderbirdMboxRecovery.sln `
            -c Release `
            --no-restore `
            -p:SelfContained=false `
            -p:PublishSingleFile=false `
            -warnaserror
          if ($LASTEXITCODE -ne 0) {
            throw "Falha no build da solução."
          }

      - name: Run integrated smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet run `
            --project tests/ThunderbirdMboxRecovery.SmokeTests/ThunderbirdMboxRecovery.SmokeTests.csproj `
            -c Release `
            --no-build
          if ($LASTEXITCODE -ne 0) {
            throw "Os smoke tests integrados falharam."
          }

      - name: Validate portable x86 and x64 publication
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "src/ThunderbirdMboxRecovery/ThunderbirdMboxRecovery.csproj"

          foreach ($rid in @("win-x86", "win-x64")) {
            $output = Join-Path $env:RUNNER_TEMP $rid

            dotnet restore $project `
              -r $rid `
              -p:SelfContained=true `
              -p:PublishSingleFile=true
            if ($LASTEXITCODE -ne 0) {
              throw "Falha no restore para $rid."
            }

            dotnet publish $project `
              -c Release `
              -r $rid `
              --self-contained true `
              --no-restore `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:PublishTrimmed=false `
              -o $output
            if ($LASTEXITCODE -ne 0) {
              throw "Falha no publish para $rid."
            }

            $exe = Join-Path $output "ThunderbirdRecoverySuite.exe"
            if (-not (Test-Path $exe -PathType Leaf)) {
              throw "Executável $rid não foi gerado."
            }

            $size = (Get-Item $exe).Length
            if ($size -lt 1MB) {
              throw "Executável $rid possui tamanho inválido: $size bytes."
            }

            Write-Host "$rid validado: $size bytes."
          }
