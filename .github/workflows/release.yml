name: Versioned Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Confirm .NET 8 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkVersion = (dotnet --version).Trim()
          Write-Host "SDK .NET selecionado: $sdkVersion"
          if (-not $sdkVersion.StartsWith("8.")) {
            throw "SDK .NET incorreto. Esperado 8.x, obtido $sdkVersion."
          }

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellSyntax.ps1 -Paths @(
            "./scripts/Publish-Portable.ps1",
            "./scripts/Test-PowerShellSyntax.ps1"
          )

      - name: Define immutable version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml] $project = Get-Content "src/ThunderbirdMboxRecovery/ThunderbirdMboxRecovery.csproj"
          $baseVersionNode = $project.SelectSingleNode("/Project/PropertyGroup/Version")

          if ($null -eq $baseVersionNode) {
            throw "A versão base não foi encontrada no arquivo .csproj."
          }

          $baseVersion = $baseVersionNode.InnerText.Trim()
          $segments = $baseVersion.Split('.')
          if ($segments.Count -lt 2) {
            throw "A versão base '$baseVersion' não possui major e minor válidos."
          }

          $runNumber = 0
          if (-not [int]::TryParse($env:GITHUB_RUN_NUMBER, [ref] $runNumber) -or $runNumber -le 0) {
            throw "GITHUB_RUN_NUMBER inválido: '$env:GITHUB_RUN_NUMBER'."
          }

          $version = "$($segments[0]).$($segments[1]).$runNumber"
          $tag = "v$version"

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Versão desta execução: $version"
          Write-Host "Tag desta execução: $tag"

      - name: Ensure immutable tag does not already exist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags --force

          $existingTag = git tag --list $env:TAG_NAME
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            throw "A tag imutável $env:TAG_NAME já existe. A execução não sobrescreverá uma release anterior."
          }

      - name: Build and run smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore ThunderbirdMboxRecovery.sln `
            -p:SelfContained=false `
            -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) {
            throw "Falha no restore da solução."
          }

          dotnet build ThunderbirdMboxRecovery.sln `
            -c Release `
            --no-restore `
            -p:SelfContained=false `
            -p:PublishSingleFile=false `
            -warnaserror
          if ($LASTEXITCODE -ne 0) {
            throw "Falha no build da solução."
          }

          dotnet run `
            --project tests/ThunderbirdMboxRecovery.SmokeTests/ThunderbirdMboxRecovery.SmokeTests.csproj `
            -c Release `
            --no-build
          if ($LASTEXITCODE -ne 0) {
            throw "Os smoke tests integrados falharam."
          }

      - name: Ensure 7-Zip is available for compressed packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidate = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if ((Get-Command 7z -ErrorAction SilentlyContinue) -or (Test-Path $candidate)) {
            Write-Host "7-Zip já está disponível."
          } else {
            choco install 7zip.commandline -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível instalar o 7-Zip para gerar os pacotes compactados."
            }
          }

      - name: Build portable win-x86 and win-x64
        shell: pwsh
        run: |
          ./scripts/Publish-Portable.ps1 `
            -OutputDirectory release `
            -Version $env:APP_VERSION

      - name: Publish new immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $title = "Thunderbird Recovery Suite v$env:APP_VERSION"
          $notes = @"
          Nova versão automática e imutável do Thunderbird Recovery Suite.

          Versão: $env:APP_VERSION
          Tag: $env:TAG_NAME
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Execução: $env:GITHUB_RUN_NUMBER

          Arquiteturas incluídas:
          - Windows x86
          - Windows x64

          Validações executadas antes da publicação:
          - análise sintática dos scripts PowerShell;
          - build da solução com warnings tratados como erros;
          - smoke tests de reparo, análise, EML, índices, backup e restauração;
          - publicação portátil x86 e x64;
          - geração de pacotes ZIP e 7Z;
          - geração de variantes menores que exigem o .NET 8 Desktop Runtime.

          Esta release não reutiliza tags, não apaga versões anteriores e não substitui assets existentes.
          Confira o arquivo SHA256SUMS.txt antes de executar os binários.
          "@

          $assets = Get-ChildItem release -File |
            Where-Object { $_.Name -match '\.(exe|zip|7z|txt)$' } |
            Sort-Object Name |
            Select-Object -ExpandProperty FullName

          if (-not $assets -or $assets.Count -eq 0) {
            throw "Nenhum arquivo foi encontrado para publicação."
          }

          $createArgs = @("release", "create", $env:TAG_NAME) + $assets + @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", $title,
            "--notes", $notes,
            "--latest"
          )

          & gh @createArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao criar a nova release imutável $env:TAG_NAME."
          }
