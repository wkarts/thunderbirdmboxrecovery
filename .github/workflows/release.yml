name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build portable win-x86 and win-x64
        shell: pwsh
        run: ./scripts/Publish-Portable.ps1 -OutputDirectory release

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $title = "Thunderbird MBOX Recovery $tag"

          $assets = Get-ChildItem release -File |
            Where-Object { $_.Name -match '\.(exe|zip|txt)$' } |
            Sort-Object Name |
            Select-Object -ExpandProperty FullName

          if (-not $assets -or $assets.Count -eq 0) {
            throw "Nenhum arquivo foi encontrado para publicação."
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $uploadArgs = @("release", "upload", $tag) + $assets + @(
              "--clobber",
              "--repo", $env:GITHUB_REPOSITORY
            )
            & gh @uploadArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao atualizar os arquivos da release $tag."
            }

            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --latest
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao atualizar a release $tag."
            }
          }
          else {
            $createArgs = @("release", "create", $tag) + $assets + @(
              "--repo", $env:GITHUB_REPOSITORY,
              "--title", $title,
              "--generate-notes",
              "--latest"
            )
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao criar a release $tag."
            }
          }
