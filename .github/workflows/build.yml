name: Build portable binaries

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuous-release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build portable win-x86 and win-x64
        shell: pwsh
        run: ./scripts/Publish-Portable.ps1 -OutputDirectory release

      - name: Publish continuous GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "continuous"
          $title = "Thunderbird MBOX Recovery - build contínuo"
          $notes = @"
          Build automático da branch $env:GITHUB_REF_NAME.

          Commit: $env:GITHUB_SHA

          Arquiteturas incluídas:
          - Windows x86
          - Windows x64

          Consulte SHA256SUMS.txt antes da execução.
          "@

          $assets = Get-ChildItem release -File |
            Where-Object { $_.Name -match '\.(exe|zip|txt)$' } |
            Sort-Object Name |
            Select-Object -ExpandProperty FullName

          if (-not $assets -or $assets.Count -eq 0) {
            throw "Nenhum arquivo foi encontrado para publicação."
          }

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" *> $null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" `
              -f sha=$env:GITHUB_SHA `
              -F force=true *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao atualizar a tag móvel $tag para o commit atual."
            }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $uploadArgs = @("release", "upload", $tag) + $assets + @(
              "--clobber",
              "--repo", $env:GITHUB_REPOSITORY
            )
            & gh @uploadArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao atualizar os arquivos da release contínua."
            }

            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes $notes `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao atualizar os metadados da release contínua."
            }
          }
          else {
            $createArgs = @("release", "create", $tag) + $assets + @(
              "--repo", $env:GITHUB_REPOSITORY,
              "--target", $env:GITHUB_SHA,
              "--title", $title,
              "--notes", $notes,
              "--prerelease",
              "--latest=false"
            )
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao criar a release contínua."
            }
          }
